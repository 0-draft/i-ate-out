<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Places you can walk into alone, scored out of ten.">
<title>I ate out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="head">
  <div class="head__inner">
    <img class="head__mark" src="assets/kanywst.png" alt="" width="160" height="160" fetchpriority="high">
    <h1 class="head__logo">I ate out</h1>
    <p class="head__tagline" data-i18n="tagline"></p>
    <button type="button" id="lang" class="lang" data-i18n="lang.other" data-i18n-aria="lang.aria"></button>
  </div>
</header>

<main>
  <nav class="tabs" id="tabs" data-i18n-aria="tabs.aria">
    <button type="button" class="tab is-on" data-view="rank" aria-current="page"><span data-i18n="tab.rank"></span><span class="tab__n" id="n-rank"></span></button>
    <button type="button" class="tab" data-view="candidates"><span data-i18n="tab.candidates"></span><span class="tab__n" id="n-cand"></span></button>
    <button type="button" class="tab" data-view="map" data-i18n="tab.map"></button>
  </nav>

  <div class="sift" id="sift">
    <label class="sift__search">
      <span class="vh" data-i18n="sift.search"></span>
      <input type="search" id="q" autocomplete="off" data-i18n-placeholder="sift.search">
    </label>
    <div class="chips" id="chips-genre" role="group"></div>
    <div class="chips chips--area" id="chips-area" role="group"></div>
    <div class="chips">
      <button type="button" class="chip chip--solo" id="chip-solo" data-i18n="sift.solo"></button>
    </div>
  </div>

  <section id="view-rank" class="view"></section>
  <section id="view-candidates" class="view" hidden></section>

  <section id="view-map" class="view" hidden>
    <div class="view__lead"><p id="map-count"></p></div>
    <div id="map" class="map"></div>
    <div id="map-rest" class="map-rest"></div>
  </section>
</main>

<footer class="foot">
  <p data-i18n-html="foot.data"></p>
  <p class="foot__links">
    <a id="export-link" href="#" download="ratings.json" data-i18n="foot.export"></a>
    <a href="https://github.com/0-draft/i-ate-out/issues/new/choose" data-i18n="foot.issue"></a>
  </p>
  <p class="foot__osm"><span data-i18n="foot.osm"></span>: <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a> contributors</p>
</footer>

<dialog id="editor" class="editor">
  <form method="dialog" class="editor__form">
    <div class="editor__head">
      <div>
        <h2 id="ed-name" class="editor__name"></h2>
        <p id="ed-meta" class="editor__meta"></p>
      </div>
      <button type="submit" value="close" class="editor__close" data-i18n-aria="ed.close">×</button>
    </div>

    <figure id="ed-figure" class="editor__figure" hidden>
      <img id="ed-photo" alt="" loading="lazy">
      <figcaption id="ed-credit"></figcaption>
    </figure>

    <p id="ed-note" class="editor__note"></p>

    <div class="scorer">
      <div class="scorer__top">
        <span class="scorer__label" data-i18n="ed.score"></span>
        <output id="ed-score" class="scorer__out">—</output>
      </div>
      <div id="ed-steps" class="scorer__steps" role="group"></div>
    </div>

    <label class="editor__field">
      <span data-i18n="ed.memo"></span>
      <textarea id="ed-memo" rows="3" data-i18n-placeholder="ed.memoPh"></textarea>
    </label>

    <label class="editor__field">
      <span data-i18n="ed.date"></span>
      <input type="date" id="ed-date">
    </label>

    <div class="editor__foot">
      <a id="ed-issue" class="btn btn--stamp" href="#" target="_blank" rel="noopener" data-i18n="ed.issue"></a>
      <a id="ed-tabelog" class="btn" href="#" target="_blank" rel="noopener" data-i18n="ed.tabelog"></a>
      <a id="ed-maps" class="btn" href="#" target="_blank" rel="noopener" data-i18n="ed.maps"></a>
      <a id="ed-photos" class="btn" href="#" target="_blank" rel="noopener" data-i18n="ed.photos"></a>
      <button type="button" id="ed-clear" class="btn btn--quiet" data-i18n="ed.clear"></button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
