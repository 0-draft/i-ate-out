name: Claude code review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A rapid re-push should supersede the in-flight review rather than post twice.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Dependabot bumps are lockfile-only, so reviewing them just burns tokens on
    # something nobody reads.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Keeps the job green (and silent) until the token is added to the repo
      # secrets, instead of turning every PR red with an auth failure.
      - name: Check for a token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      # Advisory, not a gate. A reviewer that cannot finish (expired token, empty
      # credit balance, provider outage, or the agent returning is_error) says
      # nothing about the change under review, so it must not block a merge.
      # This sits on the step rather than the job so the job's own check run
      # concludes successfully and the failure shows up as an annotation.
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        with:
          # `claude setup-token` issues an OAuth token (sk-ant-oat01-...) that runs
          # on the Claude subscription. It is not an API key and is rejected by the
          # x-api-key header, so it goes here rather than in anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the
            working directory.

            This is a personal eating-out ledger with no build step: data/shops.json
            holds the places, data/ratings.json holds one score out of ten per place,
            and plain HTML plus ES modules in assets/ render three views (candidates,
            ranking, map) on GitHub Pages. Scores also reach the repo through
            scripts/ingest-issue.js, driven by the ingest workflow.

            Focus on:
            - Correctness and edge cases. A place with no score is a candidate and a
              scored place is ranked, so anything touching `score` has to keep 0
              distinguishable from absent. Scores are 0-10 in steps of 0.5.
            - Whether a schema change was made everywhere it needs to be.
              data/shops.json, scripts/check-data.js, scripts/ingest-issue.js and the
              card rendering in assets/app.js have to agree on the shape.
            - Whether ingest still refuses input from anyone but the repo owner, and
              whether a malformed issue degrades to a comment rather than a bad commit.
            - Remote cover images: a dead URL must fall back to the genre tile, and
              nothing may hotlink a source whose licence forbids it.
            - Consistency with the surrounding code: English in code, comments and UI
              strings, Japanese only for shop names and data values, and i18n keys
              added to both dictionaries.

            Report only what you can point at in the diff. Do not restate what the
            change does, do not praise it, and skip nits a linter would already catch.
            If the change looks sound, say so in one line rather than inventing
            findings.

            Do not sign anything you post. No "Generated with" footer, no co-authored-by
            line, no self-attribution of any kind, in any comment or commit. The review
            stands on the findings, and a signature is noise on every one of them.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to point at specific lines.
            Only post GitHub comments, do not return the review as a message.

          # --allowedTools is a closed list, so the read tools have to be named
          # or the agent cannot open the files it is reviewing.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
